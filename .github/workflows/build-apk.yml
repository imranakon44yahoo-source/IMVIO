name: Build iMVIO APK

on:
  workflow_dispatch:
  push:
    paths:
      - imvio.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("android-project").resolve()
          with zipfile.ZipFile("imvio.zip") as archive:
              for item in archive.infolist():
                  if not (root / item.filename).resolve().is_relative_to(root):
                      raise ValueError("Invalid ZIP path")
              archive.extractall(root)
          assert (root / "settings.gradle.kts").is_file(), "Project root not found"
          PY

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Create test signing key
        working-directory: android-project
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build test APK
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMVIO-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
